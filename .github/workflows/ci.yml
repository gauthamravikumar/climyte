name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Runner images change their bundled simulators without notice, so pick
      # whatever iPhone is actually installed rather than pinning a model name.
      - name: Resolve a simulator destination
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 Tools/pick-simulator.py)
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project climyte.xcodeproj \
            -scheme climyte \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # A second pass under a Buddhist-calendar region. Every fixed-format
      # DateFormatter inherits Locale.current unless told otherwise, so on a
      # device whose Region is Thailand the API's "2026-08-31" was read as a
      # Buddhist year and parsed to 1483 — which emptied the hourly forecast
      # and locked the app in its night theme. That shipped once and passed a
      # full green suite, because the suite only ever ran in en_US.
      - name: Test under a non-Gregorian region
        run: |
          set -o pipefail
          xcodebuild test \
            -project climyte.xcodeproj \
            -scheme climyte \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -testRegion TH \
            -resultBundlePath TestResultsTH.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # And once more under a comma-decimal region. String(format:) has no
      # locale and always emits a full stop, so rainfall rendered as "9.5 mm"
      # to a reader whose language writes 9,5 — and no test run in en_US can
      # see that, because there the two agree.
      - name: Test under a comma-decimal region
        run: |
          set -o pipefail
          xcodebuild test \
            -project climyte.xcodeproj \
            -scheme climyte \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -testRegion DE \
            -resultBundlePath TestResultsDE.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # The app supports iOS 18, but the runs above take the newest simulator
      # on the runner, which is iOS 26: nothing was ever run on the oldest
      # system the app ships to. The picker fails here rather than fall back
      # to a newer iOS if the image stops carrying an iOS 18 runtime.
      - name: Resolve an iOS 18 simulator
        id: sim18
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 Tools/pick-simulator.py --major 18)
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test on iOS 18
        run: |
          set -o pipefail
          xcodebuild test \
            -project climyte.xcodeproj \
            -scheme climyte \
            -destination "platform=iOS Simulator,id=${{ steps.sim18.outputs.udid }}" \
            -resultBundlePath TestResults18.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            TestResultsTH.xcresult
            TestResultsDE.xcresult
            TestResults18.xcresult
          retention-days: 7
